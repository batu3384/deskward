[workspace]
resolver = "2"
members = [
    "deskward-core",
    "deskward-id",
    "deskward-relay",
    "deskward-host-macos",
    "deskward-host-windows",
    "deskward-console",
]
default-members = ["deskward-core", "deskward-id", "deskward-relay", "deskward-console"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Deskward <hello@deskward.app>"]
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
axum = "0.7"
