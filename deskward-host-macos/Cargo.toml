[package]
name = "deskward-host-macos"
description = "Deskward macOS host agent (Faz 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "deskward-host-macos"
path = "src/main.rs"

[dependencies]
deskward-core = { path = "../deskward-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "5"
xcap = "0.9.7"
enigo = "0.3"
arboard = "3"
videotoolbox = { version = "0.18", default-features = false, features = ["compression"] }
apple-cf = "0.9"
